packages:
  - apps/*
  - workers/*
  - packages/*

# Only install versions published at least seven days ago (minutes).
minimumReleaseAge: 10080
# Transitive dependencies may only come from the registry (no git or URL sources), and a
# package update can never loosen these trust settings.
blockExoticSubdeps: true
trustPolicy: no-downgrade
minimumReleaseAgeExclude: []

# No dependency may run install scripts unless listed here.
# esbuild and workerd download their platform binary in postinstall; nothing else needs scripts.
allowBuilds:
  esbuild: true
  workerd: true
  # @sentry/cli downloads its platform binary in postinstall (source-map upload in deploy).
  '@sentry/cli': true
  # core-js-pure (a transitive dependency of agents, P3-S1) only prints a funding banner in
  # postinstall; denied explicitly so the install stays scriptless.
  'core-js-pure': false

# Exact pins; Renovate bumps them.
savePrefix: ''

# Transitive pins for published advisories where the direct dependency has not moved yet.
# Drop an entry once the parent (named here) ships the fixed range.
overrides:
  # miniflare 5.20261019.2-beta pins undici 7.29.1 (eight GHSA advisories, fixed in 7.30.1).
  undici: 7.30.1

catalog:
  # /mcp Worker (P3-S1): agents pins the MCP SDK packages as exact peers.
  'agents': 0.32.0
  '@modelcontextprotocol/client': 2.4.0
  '@modelcontextprotocol/sdk': 1.32.2
  '@modelcontextprotocol/server': 2.4.0
  'minisearch': 7.2.0
  # Server card schema gate (P3-S3): the validator pair upstream's own examples use.
  'ajv': 8.20.0
  'ajv-formats': 3.0.1
  '@astrojs/check': 0.9.12
  # Resolves @astrojs/check's optional @emnapi/runtime peer. Without it pnpm picks the 2.0.0-beta.2
  # that @rolldown/binding-wasm32-wasi 1.3.0 (astro 7.4.7) pins, next to @emnapi/core 1.11.3,
  # and `astro check` cannot load @astrojs/check. Drop when the language server moves to emnapi 2.
  '@emnapi/runtime': 1.11.3
  '@astrojs/cloudflare': 14.4.2
  '@astrojs/react': 7.1.1
  '@astrojs/rss': 4.0.19
  '@astrojs/sitemap': 3.7.4
  '@axe-core/playwright': 4.14.0
  '@cloudflare/workers-types': 5.20261026.1
  '@playwright/test': 1.64.1
  '@portabletext/to-html': 6.0.0
  '@portabletext/types': 4.0.2
  '@sentry/cli': 3.8.2
  '@sentry/cloudflare': 11.9.0
  '@tailwindcss/vite': 4.3.3
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  '@types/sanitize-html': 2.16.2
  'astro': 7.4.7
  'marked': 18.1.1
  'react': 19.3.1
  'react-dom': 19.3.1
  'sanitize-html': 2.18.1
  'tailwindcss': 4.3.3
  'typescript': 6.0.3
  'vitest': 5.0.5
  'wrangler': 4.152.0
  'zod': 4.6.7
